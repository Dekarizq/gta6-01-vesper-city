<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vesper City: Neon Rain — open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070a14;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef1f5; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #rain { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 3; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud-top-left { position: absolute; top: 14px; left: 16px; }
  #hud-cash { font-size: 30px; font-weight: 800; color: #34d399; text-shadow: 0 2px 8px #000; }
  #hud-health { width: 220px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid #555; border-radius: 6px; margin-top: 6px; overflow: hidden; }
  #hud-health-fill { height: 100%; width: 100%; background: #34d399; }
  #hud-car { margin-top: 6px; font-size: 14px; color: #cbd5e1; text-shadow: 0 1px 4px #000; }
  #hud-top-right { position: absolute; top: 14px; right: 16px; text-align: right; }
  #hud-stars { font-size: 26px; letter-spacing: 2px; text-shadow: 0 2px 8px #000; }
  .star { color: #475569; } .star.on { color: #facc15; }
  #hud-storm { margin-top: 4px; font-size: 14px; font-weight: 700; color: #fda4af; text-shadow: 0 1px 4px #000; }
  #hud-district { font-size: 13px; color: #a5b4fc; text-shadow: 0 1px 4px #000; }
  #hud-objective { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%);
    background: rgba(5,8,20,.72); border: 1px solid #ff2e88; border-radius: 8px; padding: 10px 16px;
    font-size: 15px; max-width: 640px; text-align: center; }
  #hud-objective b { color: #ff7ab8; }
  .obj-dist { color: #facc15; margin-left: 10px; font-weight: 700; }
  #hud-msg { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); font-size: 18px; font-weight: 600;
    color: #fff; text-shadow: 0 2px 8px #000; text-align: center; transition: opacity .5s; max-width: 700px; }
  #hud-help { position: absolute; left: 16px; bottom: 12px; font-size: 12px; color: #94a3b8; text-shadow: 0 1px 4px #000; }
  #minimap { position: absolute; right: 16px; bottom: 12px; border: 2px solid rgba(255,46,136,.7);
    border-radius: 8px; background: #0a0e1a; box-shadow: 0 4px 18px rgba(0,0,0,.6); }
  #map-overlay { position: fixed; inset: 0; background: rgba(3,5,12,.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; pointer-events: auto; z-index: 9; }
  #map-title { font-size: 22px; font-weight: 800; letter-spacing: 2px; color: #ff2e88; margin-bottom: 12px; }
  #bigmap { border: 2px solid #ff2e88; border-radius: 10px; max-width: 90vw; max-height: 72vh; }
  #map-hint { margin-top: 10px; color: #94a3b8; }
  #title-screen { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: linear-gradient(180deg, rgba(4,6,16,.55), rgba(4,6,16,.88)); pointer-events: auto; z-index: 10; text-align: center; }
  #title-inner { max-width: 760px; padding: 24px; }
  #title-kicker { letter-spacing: 3px; font-size: 13px; color: #22d3ee; font-weight: 700; }
  #title-name { font-size: 72px; line-height: .95; margin: 14px 0; font-weight: 900; letter-spacing: 2px;
    text-shadow: 0 0 24px rgba(255,46,136,.8), 0 4px 0 #000; }
  #title-name span { color: #ff2e88; }
  #title-story { font-size: 17px; color: #dbeafe; line-height: 1.5; }
  #title-controls { font-size: 14px; color: #a5b4fc; line-height: 1.7; margin: 14px 0 20px; }
  button { pointer-events: auto; cursor: pointer; background: #ff2e88; color: #fff; border: none;
    font-size: 18px; font-weight: 800; padding: 14px 28px; border-radius: 10px; margin: 6px;
    box-shadow: 0 4px 18px rgba(255,46,136,.5); }
  button:hover { background: #ff4d9a; }
  #continue-btn { background: #0ea5e9; box-shadow: 0 4px 18px rgba(14,165,233,.5); }
  #title-foot { margin-top: 16px; font-size: 13px; color: #94a3b8; }
  #pause-screen, #dead-screen { position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; justify-content: center; background: rgba(3,5,12,.85); pointer-events: auto; z-index: 10; text-align: center; }
  #pause-screen h2, #dead-screen h2 { font-size: 44px; letter-spacing: 4px; margin: 0 0 10px; color: #ff2e88; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,10,.55) 100%); }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Vesper City: Neon Rain — open-world crime game. Drive, steal cars, run missions, outrun the police."></canvas>
<canvas id="rain"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
